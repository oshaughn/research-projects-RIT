# Default hyperpipe configuration consumed by util_RIFT_hyperpipe.py.
#
# Hydra finds this file because it lives next to util_RIFT_hyperpipe.py.
# Users can:
#   * override fields on the CLI with Hydra syntax:
#        util_RIFT_hyperpipe.py arch.n-iterations=10 general.use-osg=true
#   * point Hydra at their own file with --config-name <name>
#        (placed next to this file) or --config-path <dir>
#   * compose from the in-package defaults exposed via
#        RIFT.hyperpipe.config.DEFAULT_CONFIG_YAML
#
# The schema is documented in RIFT/hyperpipe/config.py.

arch:
  method: default
  n-iterations: 5
  n-samples-per-job: 1000
  explode-marg-jobs: 5
  explode-marg-jobs-last: null
  start-iteration: 0
  # Parsimonious-placement workflow (set tracer-only-marg: true to enable).
  # Skips MARG_* (posterior) nodes in intermediate iterations and relies on
  # MARG_PUFF (placement) jobs alone. Final N iterations still run MARG_* to
  # produce a clean posterior. Requires puff.exe to be a tracer-aware updater
  # (e.g. util_HyperparameterTracerUpdate.py).
  tracer-only-marg: false
  tracer-final-marg-iterations: 1

post:
  exe: null
  coord-module: null
  coords-fit: "x y z"
  coords-sample: "x:[-8,8] y:[-8,8] z:[-8,8]"
  coords-implied: ""
  coords-nofit: ""
  likelihood-factor-module: null
  likelihood-factor-function: null
  likelihood-factor-ini: null
  extra-args: ""
  settings:
    n-max: null
    n-step: null
    n-eff: null
    sampler-method: null
    fit-method: null
    sigma-cut: null

marg-list:
  - name: gaussian
    exe: util_HyperMargGaussian.py
    args: "--outdir gaussian_out --conforming-output-name"
    event-file: null
    n-chunk: 100
    coord-module: null
    extra-args: ""

puff:
  exe: null
  puff-factor: 0.5
  force-away: 0.03
  extra-args: ""
  # Tracer-placement sampler hyperparameters (only used when exe is a
  # tracer-aware updater; ignored by the legacy util_HyperparameterPuffball.py).
  # Leave keys null to take the updater's built-in defaults.
  settings:
    update-method: null        # smc-mala-bd | smc-mala | birth-death | puffball
    tracer-fit-method: null    # rf | rbf | polynomial | quadratic
    n-mala-steps: null         # int
    target-ess-frac: null      # float in (0,1]
    birth-death-rate: null     # float
    inj-file-prev: null        # path to previous-iteration .dat (enables SMC bridging)
    no-union-refit: false      # opt out of union refit when inj-file-prev is given
    regularize: false
    rng-seed: null             # int; deterministic when given
    state-in: null
    state-out: null

test:
  exe: convergence_test_samples
  method: JS
  threshold: 0.05
  extra-args: ""

init:
  file: null
  generation:
    placement-method: null
    params-and-ranges: null
    npts: null
    external-code: null
    external-args: null

general:
  rundir: null
  retries: 0
  request-disk: 10M
  request-memory: 16384
  use-osg: false
  use-singularity: false
  use-singularity-local: false
  condor-local-nonworker: false
  condor-local-nonworker-igwn-prefix: false
  condor-nogrid-nonworker: false
  use-full-submit-paths: true
  transfer-files: []
  dry-run: false
