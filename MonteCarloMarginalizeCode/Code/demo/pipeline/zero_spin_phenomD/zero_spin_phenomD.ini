# Minimal RIFT ini for the zero-spin IMRPhenomD validation demo.  Derived from
# .travis/ref_ini/GW150914.ini but stripped to settings compatible with a fast
# zero-spin BBH test using the AV sampler.  The [rift-pseudo-pipe] section
# avoids fields that would override --approx / --assume-nospin / --ile-sampler-method
# on the util_RIFT_pseudo_pipe.py command line.

[analysis]
ifos=['H1','L1']
singularity=False
osg=False

[paths]

[input]
max-psd-length=10000

[condor]
accounting_group=ligo.sim.o4.cbc.pe.rift
accounting_group_user=richard.oshaughnessy

[datafind]
url-type=file
types = {'H1': 'H1_HOFT_C02', 'L1': 'L1_HOFT_C02', 'V1': ''}

[data]
channels = {'H1': 'H1:DCS-CALIB_STRAIN_C02','L1': 'L1:DCS-CALIB_STRAIN_C02', 'V1': ''}

[lalinference]
flow = {'H1': 20, 'L1': 20}
fhigh = { 'H1': 896, 'L1': 896  }

[engine]
fref=20
amporder = -1
seglen = 4
srate = 2048
# zero spin -> compatible with IMRPhenomD
a_spin1-max = 0.0
a_spin2-max = 0.0
chirpmass-min = 23.0
chirpmass-max = 35.0
comp-min = 1
comp-max = 1000
distance-max = 1000
aligned-spin =
alignedspin-zprior =

[rift-pseudo-pipe]
# Keep this section minimal so the CLI args (--approx IMRPhenomD,
# --assume-nospin, --ile-sampler-method AV, --add-extrinsic, etc.) win.
internal-ile-request-disk="4M"
cip-fit-method="rf"
ile-n-eff=10
l-max=2
internal-distance-max=1000
ile-runtime-max-minutes=60
ile-jobs-per-worker=30
internal-propose-converge-last-stage=True
force-eta-range="[0.20,0.24999]"
fmin-template=20
event-time=1126259462.391
n-output-samples=5000
use-online-psd=False
