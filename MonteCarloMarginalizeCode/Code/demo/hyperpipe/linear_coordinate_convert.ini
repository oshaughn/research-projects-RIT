# Example configuration for demo/hyperpipe/linear_coordinate_convert.py.
#
# This pairs with the 3-D Gaussian example in this directory: the grid file
# blind_gaussian_3d_xy_plus.dat has columns (x, y, z), and we fit & sample in
# a rotated/shifted basis (u, v, w) where
#
#     u =  cos(theta) * x + sin(theta) * y
#     v = -sin(theta) * x + cos(theta) * y
#     w =  z
#
# with theta = pi/4 (45 degrees) and a zero offset.  Swap the matrix below
# for anything you like; the only constraint is that the column counts match
# input_parameters / output_parameters.

[linear]
input_parameters  = x, y, z
output_parameters = u, v, w

# theta = pi/4  =>  cos(theta) = sin(theta) ~= 0.70710678
A = [[ 0.70710678,  0.70710678,  0.0],
     [-0.70710678,  0.70710678,  0.0],
     [ 0.0,         0.0,         1.0]]

b = [0.0, 0.0, 0.0]
