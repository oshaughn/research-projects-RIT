# RIFT ini for a full GW150914 run (IMRPhenomD, aligned spin), CIT / singularity.
#
# GW150914: GPS 1126259462.4, H1 + L1 only (no Virgo in O1), O1 4 kHz GWOSC open
# data.  IMPORTANT: the O1 open-data in-frame channel is <IFO>:LOSC-STRAIN (NOT
# the O4-era GWOSC-4KHZ_R1_STRAIN).  Verified by reading the frame channel table.
#
# This ini supplies data geometry (seglen/srate/fmin/fmax, channels, ifos) that
# util_RIFT_pseudo_pipe.py has no CLI flag for.  Command-line args on
# util_RIFT_pseudo_pipe.py (--approx, --l-max, --assume-nospin, --force-mc-range,
# the extrinsic + OSG flags, sizes) WIN over this ini, so [rift-pseudo-pipe] is
# kept minimal.  Spin is pinned to zero by the CLI flag --assume-nospin.
#
# CIT: [analysis] singularity=True -> the pipeline reads SINGULARITY_RIFT_IMAGE.
# Strain is the LOCAL GWOSC frames + cache (--fake-data-cache); OSG/CVMFS not used
# for data (frames ride along via --use-osg-file-transfer).

[analysis]
ifos=['H1','L1']
singularity=True
osg=True

[paths]

[input]
max-psd-length=10000

[condor]
accounting_group=ligo.dev.o4.cbc.pe.rift
accounting_group_user=richard.oshaughnessy

[datafind]
url-type=file
# GWOSC O1 public strain (already downloaded locally under data/). Frame tags.
types = {'H1': 'H1_LOSC_4_V1', 'L1': 'L1_LOSC_4_V1'}

[data]
# O1 open-data channel is <IFO>:LOSC-STRAIN (prefixed form for the ini).
channels = {'H1': 'H1:LOSC-STRAIN', 'L1': 'L1:LOSC-STRAIN'}

[lalinference]
# minimum-frequency 20 per IFO; maximum-frequency 1024 (heavy system, srate 4096).
flow = {'H1': 20, 'L1': 20}
fhigh = {'H1': 1024, 'L1': 1024}

[engine]
fref=20
amporder = -1
# GW150914 is heavy (Mc~28): a short 8-s segment at srate 4096 is plenty.
seglen = 8
srate = 4096
approx = IMRPhenomD
# Chirp-mass window bracketing GW150914 (Mc~28); matches CLI --force-mc-range [25,35].
chirpmass-min = 25
chirpmass-max = 35
comp-min = 5
comp-max = 100
distance-max = 1000
# Aligned-spin analysis; spins are pinned to zero via CLI --assume-nospin.

[rift-pseudo-pipe]
# Keep minimal: CLI args win. (Do NOT set sizes / request-disk here -- the ini
# parser would override the command line.)
cip-fit-method="rf"
l-max=2
internal-distance-max=1000
fmin-template=20
event-time=1126259462.4
n-output-samples=5000
use-online-psd=False
