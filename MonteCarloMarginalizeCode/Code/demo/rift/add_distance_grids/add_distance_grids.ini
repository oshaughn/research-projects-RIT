[analysis]
ifos=['H1','L1']
singularity=False
osg=False

[paths]

[input]
max-psd-length=10000

[condor]
accounting_group=ligo.sim.o4.cbc.pe.rift
accounting_group_user=oshaughn

[datafind]
url-type=file
types = {'H1': 'FAKE', 'L1': 'FAKE'}

[data]
channels = {'H1': 'H1:FAKE-STRAIN', 'L1': 'L1:FAKE-STRAIN'}

[lalinference]
flow = {'H1': 20, 'L1': 20}
fhigh = {'H1': 1700, 'L1': 1700}

[engine]
fref=100
approx=SEOBNRv4
amporder = -1
seglen = 8
srate = 4096

chirpmass-min = 23
chirpmass-max = 35
comp-min = 1
comp-max = 1000
distance-max = 1000

[rift-pseudo-pipe]
approx="SEOBNRv4"
assume-nospin=True
assume-nonprecessing=False
assume-precessing=False

l-max=2
fmin-template=10
event-time=1000000014.236547946
manual-postfix="_distance_grids"

force-mc-range="[23,35]"
force-eta-range="[0.20,0.24999]"
force-initial-grid-size=100
internal-force-iterations=2
internal-n-iterations-subdag-max=2
internal-truncate-cip-arg-list=1

ile-n-eff=50
ile-jobs-per-worker=20
ile-jobs-per-worker-first=20
ile-copies=1
ile-no-gpu=True
ile-sampler-method="GMM"
internal-ile-use-lnL=True
internal-ile-reset-adapt=True
internal-ile-inv-spec-trunc-time=0
manual-extra-ile-args=" --data-start-time 1000000008 --data-end-time 1000000016 --no-adapt-after-first --no-adapt-distance --srate 4096 "

export-marginal-distance-grid=True

cip-fit-method="gp"
cip-sampler-method="GMM"
cip-explode-jobs=1
cip-explode-jobs-last=1
internal-cip-request-memory=4096
n-output-samples=1000
n-output-samples-last=2000

use_osg=False
use_osg_file_transfer=False
use_osg_cip=False
ile-retries=1
general-retries=1
skip-reproducibility=True
