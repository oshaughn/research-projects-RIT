# =============================================================================
# EXAMPLE ini shape: multi-GPU fan-out + multi-container (container family), together.
#
# This ONE ini carries both features so an end user can copy it as a template:
#   * multi-GPU fan-out  -> RIFT_ILE_GPU_FANOUT (here 'all': grab every node GPU)
#   * multi-container    -> the container-family manifest (per-machine .sif selection
#                           by GPU capability) + a GPU capability floor
#
# Build (no submit) with `make build-combo` (fills @MANIFEST@/@BASE_EXE_DIR@ + per-run
# paths) or directly:
#   util_RIFT_pseudo_pipe.py --use-ini this.ini --use-coinc ci_coinc.xml \
#     --use-rundir rundir --fake-data-cache zero_noise.cache --assume-nospin
#
# It is a SILLY validation config (IMRPhenomD, zero spin, CI synthetic data) so it can
# actually build/run; swap the physics for a real analysis.
#
# ---- HOW ini VALUES ARE READ (important) ------------------------------------------
# Keys in [rift-pseudo-pipe] that match a util_RIFT_pseudo_pipe.py option are eval()'d,
# so STRING values must be QUOTED:  approx="IMRPhenomD",  ile-gpu-fanout="all".
# Numbers/booleans are bare:  ile-jobs-per-worker=100,  ile-force-gpu=True.
# A few keys are consumed as raw strings into the environment (NOT eval'd, NOT quoted):
#   singularity_rift_image, singularity_base_exe_dir, ile_require_gpus, accounting_group.
# The environment still WINS over the ini for those (export to override a shared ini).
# =============================================================================

[analysis]
ifos=['H1','L1','V1']
singularity=True
osg=True

[condor]
accounting_group=ligo.sim.o4.cbc.pe.rift
accounting_group_user=albert.einstein

[datafind]
url-type=file
types = {'H1': 'fake_strain', 'L1': 'fake_strain', 'V1': 'fake_strain'}

[data]
channels = {'H1': 'H1:FAKE-STRAIN','L1': 'L1:FAKE-STRAIN', 'V1': 'V1:FAKE-STRAIN'}

[lalinference]
flow = {'H1': 10, 'L1': 10, 'V1': 10}
fhigh = { 'H1': 1700, 'L1': 1700, 'V1': 1700 }

[engine]
fref=20
amporder = -1
seglen = 8
srate = 4096
a_spin1-max = 0.0
a_spin2-max = 0.0
chirpmass-min = 23.0
chirpmass-max = 35.0
comp-min = 1
comp-max = 1000
distance-max = 1000
aligned-spin =
alignedspin-zprior =

[rift-pseudo-pipe]
# ---- silly PE physics (matches the CI synthetic data; swap for a real run) --------
approx="IMRPhenomD"
l-max=2
fmin-template=10
event-time=1000000014.236547946
force-eta-range="[0.20,0.24999]"
internal-distance-max=1000
n-output-samples=2000
use-online-psd=False

# ---- MULTI-GPU FAN-OUT ------------------------------------------------------------
ile-force-gpu=True             # ILE requests+uses a GPU (fan-out needs the GPU path)
ile-gpu-fanout="all"           # QUOTED: grab every physical GPU on the node (default too).
                               #   Use "1" for a single-GPU run, or a number N, or "auto-max-N".
ile-jobs-per-worker=100        # points evaluated per ILE job == what the fan-out splits
ile-n-eff=10
ile-runtime-max-minutes=120

# ---- MULTI-CONTAINER (container family) -------------------------------------------
use-osg=True                   # container-family per-machine image selection uses OSG-mode wiring
use-singularity=True
singularity_rift_image=@MANIFEST@       # the container-family .yaml (manifest of >=2 .sif images)
singularity_base_exe_dir=@BASE_EXE_DIR@ # dir of the RIFT bin INSIDE the images (e.g. /usr/local/bin/)
ile_require_gpus=(Capability >= 8.0) && (Capability <= 12.0)   # capability floor (adds to the family's)
