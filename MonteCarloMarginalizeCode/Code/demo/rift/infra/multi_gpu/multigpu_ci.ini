# CI-matched RIFT ini for the multi-GPU fan-out demo (`make build`).
# Matches the zero-noise synthetic CI data in .travis/ILE-GPU-Paper/demos: 3 IFOs
# (H1,L1,V1) with FAKE-STRAIN channels, srate 4096, seglen 8, fmin 10, zero spin
# (IMRPhenomD-compatible), mc in [23,35], event 1000000014.236.  This is the SAME
# data the calmarg demo uses; here we strip calmarg and instead exercise the
# multi-GPU ILE fan-out.  CLI args on the util_RIFT_pseudo_pipe.py line win, so
# keep [rift-pseudo-pipe] minimal.

[analysis]
ifos=['H1','L1','V1']
singularity=False
osg=False

[paths]

[input]
max-psd-length=10000

[condor]
accounting_group=ligo.sim.o4.cbc.pe.rift
accounting_group_user=richard.oshaughnessy

[datafind]
url-type=file
types = {'H1': 'fake_strain', 'L1': 'fake_strain', 'V1': 'fake_strain'}

[data]
channels = {'H1': 'H1:FAKE-STRAIN','L1': 'L1:FAKE-STRAIN', 'V1': 'V1:FAKE-STRAIN'}

[lalinference]
flow = {'H1': 10, 'L1': 10, 'V1': 10}
fhigh = { 'H1': 1700, 'L1': 1700, 'V1': 1700 }

[engine]
fref=20
amporder = -1
seglen = 8
srate = 4096
a_spin1-max = 0.0
a_spin2-max = 0.0
chirpmass-min = 23.0
chirpmass-max = 35.0
comp-min = 1
comp-max = 1000
distance-max = 1000
aligned-spin =
alignedspin-zprior =

[rift-pseudo-pipe]
cip-fit-method="rf"
ile-n-eff=10
l-max=2
internal-distance-max=1000
ile-runtime-max-minutes=120
# Many intrinsic points per ILE job (= macrongroup).  This is what the fan-out
# splits across the GPUs: with 100 points/job and --ile-gpu-fanout 4, each GPU
# evaluates ~25 points concurrently.  Keep it a comfortable multiple of the
# fan-out so the split is even.  (Production distexport runs use 100.)
ile-jobs-per-worker=100
internal-propose-converge-last-stage=True
force-eta-range="[0.20,0.24999]"
fmin-template=10
event-time=1000000014.236547946
n-output-samples=2000
use-online-psd=False
