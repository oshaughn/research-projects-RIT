###########################################################################################
# LISA toy-demo config, production-ini form.
#
# Drives the SAME validated LISA known-sky workflow as the --lisa-* CLI flags,
# but through the production entry point:
#
#     util_RIFT_pseudo_pipe.py --use-ini BBH_lisa_demo.ini --use-rundir <RUNDIR>
#
# Per-channel data products (channels, PSDs) are read from the conventional
# [data]/[lalinference] sections; every other option flows through the generic
# [rift-pseudo-pipe] parser by CLI-arg name (s/-/_/).  Values are eval()'d, so
# strings/paths must be quoted and booleans are bare True/False.
#
# ConfigParser does no path interpolation: replace __BUNDLE_DIR__ below with the
# absolute path of the bundle written by make_synthetic_lisa_inputs.py (the dir
# holding lisa.cache and {A,E,T}_psd.xml.gz).  run_lisa_ini_demo.sh does this for
# you.  Stays IMRPhenomD -- toy demo.
###########################################################################################

[data]
# strain channel name carried in the cache / h5 frames, per LISA channel A,E,T
channels = {'A': 'fake_strain', 'E': 'fake_strain', 'T': 'fake_strain'}

[lalinference]
# per-channel PSD xml(.gz)
psds = {'A': '__BUNDLE_DIR__/A_psd.xml.gz', 'E': '__BUNDLE_DIR__/E_psd.xml.gz', 'T': '__BUNDLE_DIR__/T_psd.xml.gz'}

[rift-pseudo-pipe]
### route to the LISA known-sky builder ###
lisa-known-sky=True
lisa-vary-sky=True
lisa-search-reflected-sky-mode=True
lisa-reference-time=0

### source / sky (injected ecliptic location) ###
approx="IMRPhenomD"
event-time=0
ecliptic-longitude=1.0
ecliptic-latitude=0.3

### data products / band ###
lisa-cache-file="__BUNDLE_DIR__/lisa.cache"
lisa-srate=0.25
lisa-fmin-template=0.0001
lisa-fmax=0.125
lisa-reference-freq=0.005
lisa-data-integration-window-half=300

### grid / iteration ###
lisa-grid-size=16
lisa-n-iterations=4
lisa-n-samples-per-job=16
internal-ile-request-memory=2048
internal-cip-request-memory=2048
