# CI-matched RIFT ini for the in-loop calmarg pseudo_pipe RUN target (pp-run).
# Matches the zero-noise synthetic CI data in .travis/ILE-GPU-Paper/demos: 3 IFOs
# (H1,L1,V1) with FAKE-STRAIN channels, srate 4096, seglen 8 (the 8 s frame
# [1000000008,1000000016]; event 1000000014 + buffer 2 - seglen 8 = that frame),
# fmin 10, zero spin (IMRPhenomD-compatible), mc in [23,35].  CLI args on the
# util_RIFT_pseudo_pipe.py command line (--approx, --assume-nospin, calmarg flags,
# time-resampling, ...) win, so keep [rift-pseudo-pipe] minimal.

[analysis]
ifos=['H1','L1','V1']
singularity=False
osg=False

[paths]

[input]
max-psd-length=10000

[condor]
accounting_group=ligo.sim.o4.cbc.pe.rift
accounting_group_user=richard.oshaughnessy

[datafind]
url-type=file
types = {'H1': 'fake_strain', 'L1': 'fake_strain', 'V1': 'fake_strain'}

[data]
channels = {'H1': 'H1:FAKE-STRAIN','L1': 'L1:FAKE-STRAIN', 'V1': 'V1:FAKE-STRAIN'}

[lalinference]
flow = {'H1': 10, 'L1': 10, 'V1': 10}
fhigh = { 'H1': 1700, 'L1': 1700, 'V1': 1700 }

[engine]
fref=20
amporder = -1
seglen = 8
srate = 4096
a_spin1-max = 0.0
a_spin2-max = 0.0
chirpmass-min = 23.0
chirpmass-max = 35.0
comp-min = 1
comp-max = 1000
distance-max = 1000
aligned-spin =
alignedspin-zprior =

[rift-pseudo-pipe]
# NOTE: disk requests are set from the util_RIFT_pseudo_pipe.py CLI (the Makefile), NOT
# here -- a value in this [rift-pseudo-pipe] section OVERRIDES the CLI, which would defeat
# the container +4GB disk bump.  So keep internal-*-request-disk OUT of this ini.
cip-fit-method="rf"
ile-n-eff=10
l-max=2
internal-distance-max=1000
ile-runtime-max-minutes=120
# calmarg ILE is VERY expensive (fused kernel + cal MC + distance marg).  Runtime profile
# (2026-06-14, 525 real-event ILE jobs at 50 points/job): GTX 1050 Ti cc6.1 median 118 min
# (>wall, 53% killed!); Blackwell cc12.0 median 65 min (25% killed); A30 cc8.0 median 22 min.
# So 50 points/job does NOT fit the 120-min wall even on Blackwell's tail.  Drop to 10 points
# (~5x shorter -> ~13 min on Blackwell, well under the wall).  Pair with cc>=8.0 floor (drop
# the slow 1050 Ti) via RIFT_REQUIRE_GPUS in setup_here.sh.  NOTE: an ini value in
# [rift-pseudo-pipe] OVERRIDES the CLI, so set it here, not on the make line.
ile-jobs-per-worker=10
internal-propose-converge-last-stage=True
force-eta-range="[0.20,0.24999]"
fmin-template=10
event-time=1000000014.236547946
n-output-samples=2000
use-online-psd=False
