documentation:
  stage: docs
  image: debian:bookworm
  script:
    - apt-get -y install graphviz
    - cd docs
    - pip install -r requirements.txt --break-system-packages
    - make clean
    - cd ..
    - sphinx-build docs/source/ docs/build/

  artifacts:
    paths:
      - docs/build/
