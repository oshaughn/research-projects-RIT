variables:
  BRANCH: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
  COMMIT: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
  RIFT_IMAGE: $CI_REGISTRY_IMAGE/rift


default:
  # debian:latest (trixie) caused problems, lock version for now
  image: debian:bookworm

stages:
  - system tests
  - unit tests # TODO: write some
  - docs
#  - docker image
#  - deploy

.install_docker_dependencies:
  before_script:
     - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
     - apk add --update git py3-pip 
     - if [ ! -e /usr/bin/python ]; then ln -s /usr/bin/python3 /usr/bin/python; fi


before_script:
  # setup
  - apt-get update --assume-yes && apt-get upgrade --assume-yes && apt-get install --assume-yes git python3-pip
  # Create alias for /usr/bin/python3 -> /usr/bin/python
  - ln -s /usr/bin/python3 /usr/bin/python
  # upgrade pip
  - python -m pip install --quiet --upgrade pip  --break-system-packages
  # install requirements
  - python -m pip install -r requirements.txt --break-system-packages
  # install test-only requirements
  - python -m pip install coverage pytest --break-system-packages
  # install this package (need editable for coverage)
  - python -m pip install --editable . --break-system-packages

help_check:
  stage: system tests
  script:
    - . .travis/test-all-bin.sh

import_check:
  stage: system tests
  script:
    - python .travis/test-all-mod.py
    - python -m pytest -q MonteCarloMarginalizeCode/Code/test/test_lisa_response_import.py
    - python -m pytest -q MonteCarloMarginalizeCode/Code/test/test_lisa_lalsimutils_compat.py
    - python -m pytest -q MonteCarloMarginalizeCode/Code/test/test_lisa_operational_synthetic.py

sim_manager_check:
  stage: unit tests
  script:
    # lscsoft-glue is optional; if it installs, the smoke test also exercises
    # the Condor build_master_job + generate_dag round trip. If it fails to
    # install, the condor portion of the test simply skips.
    - python -m pip install lscsoft-glue --break-system-packages || echo "lscsoft-glue unavailable; condor portion will skip"
    - bash .travis/test-simulation-manager.sh

test_run:
  stage: system tests
  script:
    - . .travis/test-coord.sh
    - . .travis/test-integrate.sh
    - . .travis/test-posterior.sh
    -  bash  .travis/test-run.sh
    -  bash .travis/test-run-alts.sh
    -  bash .travis/test-build.sh

