variables:
  BRANCH: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
  COMMIT: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
  RIFT_IMAGE: $CI_REGISTRY_IMAGE/rift


default:
  # debian:latest (trixie) caused problems, lock version for now
  image: debian:bookworm

stages:
  - containers
  - system tests
  - unit tests # TODO: write some
  - docs
#  - docker image
#  - deploy

.pixi_template:
  stage: system tests
  before_script: []
  variables:
    PIXI_HOME: "$CI_PROJECT_DIR/.pixi"
    PIXI_CACHE_DIR: "$CI_PROJECT_DIR/.pixi-cache"
    XDG_CACHE_HOME: "$CI_PROJECT_DIR/.pixi-cache/xdg"
    PATH: "$CI_PROJECT_DIR/.pixi/bin:$PATH"
  cache:
    key: pixi-$CI_JOB_NAME
    paths:
      - .pixi/
      - .pixi-cache/
      - .pixi/envs/
  script:
    - apt-get update --assume-yes && apt-get install --assume-yes ca-certificates curl git
    - curl -fsSL https://pixi.sh/install.sh | bash
    - export PATH="$PIXI_HOME/bin:$PATH"
    - pixi --version
    - pixi run -e "$PIXI_ENV" swig-version
    - pixi run -e "$PIXI_ENV" install-rift
    - pixi run -e "$PIXI_ENV" import-check

.install_docker_dependencies:
  before_script:
     - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
     - apk add --update git py3-pip 
     - if [ ! -e /usr/bin/python ]; then ln -s /usr/bin/python3 /usr/bin/python; fi


before_script:
  # setup
  - apt-get update --assume-yes && apt-get upgrade --assume-yes && apt-get install --assume-yes git python3-pip
  # Create alias for /usr/bin/python3 -> /usr/bin/python
  - ln -s /usr/bin/python3 /usr/bin/python
  # upgrade pip
  - python -m pip install --quiet --upgrade pip  --break-system-packages
  # install requirements
  - python -m pip install -r requirements.txt --break-system-packages
  # install test-only requirements
  - python -m pip install coverage pytest --break-system-packages
  # install this package (need editable for coverage)
  - python -m pip install --editable . --break-system-packages

build_gpu_container:
  stage: containers
  tags:
    - gpu
  variables:
    RIFT_CI_APPTAINER_IMAGE: "/home/richard.oshaughnessy/rift-ci-gpu.sif"
  before_script: []
  script:
    - mkdir -p "$(dirname "$RIFT_CI_APPTAINER_IMAGE")"
    - apptainer build --force "$RIFT_CI_APPTAINER_IMAGE" rift_container.def
    - apptainer exec --nv "$RIFT_CI_APPTAINER_IMAGE" python -c 'import cupy; x = cupy.arange(8, dtype=cupy.float64); print("cupy", cupy.__version__, "sum", float(cupy.asnumpy((x * x).sum())))'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
    - when: never

help_check:
  stage: system tests
  script:
    - . .travis/test-all-bin.sh

import_check:
  stage: system tests
  script:
    - python .travis/test-all-mod.py
    - python -m pytest -q MonteCarloMarginalizeCode/Code/test/test_lisa_response_import.py
    - python -m pytest -q MonteCarloMarginalizeCode/Code/test/test_lisa_lalsimutils_compat.py
    - python -m pytest -q MonteCarloMarginalizeCode/Code/test/test_lisa_operational_synthetic.py
    - python -m pytest -q MonteCarloMarginalizeCode/Code/test/test_lisa_helper_contract.py
    - python -m pytest -q MonteCarloMarginalizeCode/Code/test/test_spherical_harmonics_backend.py

dependency_compat_check:
  stage: system tests
  script:
    - python .travis/test-dependency-compat.py

sim_manager_check:
  stage: unit tests
  script:
    # lscsoft-glue is optional; if it installs, the smoke test also exercises
    # the Condor build_master_job + generate_dag round trip. If it fails to
    # install, the condor portion of the test simply skips.
    - python -m pip install lscsoft-glue --break-system-packages || echo "lscsoft-glue unavailable; condor portion will skip"
    - bash .travis/test-simulation-manager.sh

calmarg_check:
  stage: unit tests
  script:
    # in-loop calibration marginalization + per-realization self-term (CPU).
    - bash .travis/test-calmarg.sh

integrator_gate_accounting_check:
  stage: unit tests
  script:
    # The shape-recovery gate and its opt-in flag probe are far too expensive for CI and stay out
    # of it.  The ACCOUNTING that decides whether one of their rows blocks a merge is neither: it
    # is pure logic, runs in seconds (no sampler is built), and a bug in it silently CLEARS a real
    # regression -- which is how a noisy row failed a PR and how an untested row could pass one.
    # So that part runs on every pipeline.
    - python -m pytest -q MonteCarloMarginalizeCode/Code/test/expensive_before_merging/integrators/test_probe_confirm.py

test_run:
  stage: system tests
  script:
    # CIP prior densities + the --eccentricity-prior coordinate wiring (pure
    # numpy/scipy, seconds). Runs before the heavy scripts so a wrong prior fails
    # fast rather than after the end-to-end runs.
    - python -m pytest -q MonteCarloMarginalizeCode/Code/test/test_cip_priors.py
    - . .travis/test-coord.sh
    - bash .travis/test-integrate.sh
    - . .travis/test-posterior.sh
    -  bash  .travis/test-run.sh
    -  bash .travis/test-run-alts.sh
    -  bash .travis/test-build.sh

gpu_integration:
  stage: system tests
  tags:
    - gpu
  variables:
    CUDA_VISIBLE_DEVICES: "0"
    GW_SURROGATE: ""
    RIFT_CI_REQUIRE_GPU: "1"
    RIFT_CI_APPTAINER_IMAGE: "/home/richard.oshaughnessy/rift-ci-gpu.sif"
    RIFT_CI_APPTAINER_BINDPATH: "/cvmfs,/home"
  before_script: []
  script:
    - nvidia-smi
    - test -n "$RIFT_CI_APPTAINER_IMAGE"
    - test -r "$RIFT_CI_APPTAINER_IMAGE"
    - >
      apptainer exec --nv --cleanenv
      --bind "$CI_PROJECT_DIR:$CI_PROJECT_DIR"
      --bind "$RIFT_CI_APPTAINER_BINDPATH"
      --env CI_PROJECT_DIR="$CI_PROJECT_DIR"
      --env CUDA_VISIBLE_DEVICES="$CUDA_VISIBLE_DEVICES"
      --env GW_SURROGATE="$GW_SURROGATE"
      --env RIFT_CI_REQUIRE_GPU="$RIFT_CI_REQUIRE_GPU"
      "$RIFT_CI_APPTAINER_IMAGE"
      bash -lc 'cd "$CI_PROJECT_DIR" && export PYTHONPATH="$CI_PROJECT_DIR/MonteCarloMarginalizeCode/Code${PYTHONPATH:+:$PYTHONPATH}" && bash .travis/test-integrate.sh && bash .travis/test-calmarg-gpu.sh && bash .travis/test-lisa-gpu.sh'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: on_success
      allow_failure: false
    - when: never

pixi_swig_pre44:
  extends: .pixi_template
  variables:
    PIXI_ENV: swig-pre44

pixi_swig_post44:
  extends: .pixi_template
  variables:
    PIXI_ENV: swig-post44

