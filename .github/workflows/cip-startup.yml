name: CIP startup

on:
  push:
    branches: [rift_O4c]
  pull_request:
    branches: [rift_O4c]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cip-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GW_SURROGATE: ""
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime and test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libgsl-dev
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --editable . pytest
      - name: Run real CIP startup and EOS validation regressions
        run: |
          python -m pytest -q \
            MonteCarloMarginalizeCode/Code/test/test_cip_startup.py \
            MonteCarloMarginalizeCode/Code/test/test_lalsim_eos_compat.py
