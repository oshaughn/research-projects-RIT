name: Asimov 0.8 integration
run-name: ${{ github.workflow }} / ${{ inputs.canary_id || github.event_name }} / ${{ inputs.runner || 'ubuntu-24.04' }}

on:
  push:
    branches: [rift_O4c]
  pull_request:
    branches: [rift_O4c]

  workflow_dispatch:
    inputs:
      runner:
        description: Ubuntu runner (latest is the upstream migration canary)
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - ubuntu-latest
      canary_id:
        description: Correlation ID supplied by the default-branch scheduler
        type: string
        default: ''

jobs:
  asimov-integration:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Enable python symlink
        run: sudo ln -sf $(which python3) /usr/bin/python
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev
      - name: Install RIFT and test dependencies
        run: |
          python -m pip install --upgrade pip --break-system-packages
          python -m pip install -r requirements.txt --break-system-packages
          python -m pip install pytest --break-system-packages
          python -m pip install --editable . --break-system-packages
          python -m pip install htcondor --only-binary=:all: --break-system-packages
      - name: Install Asimov 0.8 and external pipeline plugins
        run: |
          python -m pip install \
            'asimov==0.8.0' \
            bilby \
            'asimov-gwdata>=0.4,<0.5' \
            'asimov-bayeswave>=0.2,<0.3' \
            'pe-configurator>=1,<2' \
            --break-system-packages
      - name: Run Asimov integration tests
        run: bash .travis/test-asimov-08.sh
