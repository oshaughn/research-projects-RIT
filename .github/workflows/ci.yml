name: CI

on:
  push:
    branches: [rift_O4d, rift_O4d_junior, rift_O4d_gmm_gpu]
  pull_request:
    branches: [rift_O4d, rift_O4d_junior, rift_O4d_gmm_gpu]
  workflow_dispatch:
  schedule:
    # Weekly canary so a fresh UPSTREAM release (e.g. swig>=4.4.0 -- see #136)
    # is caught even when there is no RIFT commit. Mondays 06:00 UTC.
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Smoke-test that the package resolves and installs across the supported
        # Python range, including the legacy py3.9 lane (paired with the pinned
        # numpy==1.24.4 used by the integrator gate below).
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Enable symlink
        run: sudo ln -sf $(which python3) /usr/bin/python
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --break-system-packages
          python -m pip install -r requirements.txt --break-system-packages
          python -m pip install coverage pytest pytest-cov --break-system-packages
          python -m pip install --editable . --break-system-packages

  help-check:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Enable symlink
        run: sudo ln -sf $(which python3) /usr/bin/python
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --break-system-packages
          python -m pip install -r requirements.txt --break-system-packages
          python -m pip install coverage pytest --break-system-packages
          python -m pip install --editable . --break-system-packages
      - name: Run help check
        run: .travis/test-all-bin.sh

  import-check:
    needs: install
    runs-on: ubuntu-latest
    # Verify every declared module imports cleanly under both the pinned
    # legacy lane (py3.9 + numpy 1.24.4) and the modern lane (py3.12 +
    # numpy 2.x). Catches platform-portability regressions like the
    # np.float128 import-time crash on numpy 2.x systems without an
    # extended-precision long double.
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: legacy
            python-version: '3.9'
            numpy-pin: 'numpy==1.24.4'
          - lane: modern
            python-version: '3.12'
            numpy-pin: 'numpy>=2.0,<3.0'
    name: import-check (${{ matrix.lane }} py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Enable symlink
        run: sudo ln -sf $(which python3) /usr/bin/python
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --break-system-packages
          python -m pip install -r requirements.txt --break-system-packages
          # Pin numpy AFTER requirements.txt so it overrides the unpinned
          # 'numpy' line in requirements.txt without changing the file.
          python -m pip install '${{ matrix.numpy-pin }}' --break-system-packages
          python -m pip install coverage pytest --break-system-packages
          python -m pip install --editable . --break-system-packages
      - name: Show resolved versions
        run: |
          python -c "import sys, numpy, scipy; print('python', sys.version); print('numpy', numpy.__version__); print('scipy', scipy.__version__)"
      - name: Run import check
        run: python .travis/test-all-mod.py

  dependency-compat-check:
    needs: install
    runs-on: ubuntu-latest
    # Focused upstream-library smoke test for scipy/h5py/numba/matplotlib plus
    # RIFT's portable precision dtype. This complements the broader import and
    # test-run jobs with a compact version matrix and small functional probes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: legacy
            python-version: '3.9'
            numpy-pin: 'numpy==1.24.4'
          - lane: modern
            python-version: '3.12'
            numpy-pin: 'numpy>=2.0,<3.0'
    name: dependency-compat-check (${{ matrix.lane }} py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Enable symlink
        run: sudo ln -sf $(which python3) /usr/bin/python
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --break-system-packages
          python -m pip install -r requirements.txt --break-system-packages
          # Pin numpy AFTER requirements.txt so it overrides the unpinned
          # 'numpy' line in requirements.txt without changing the file.
          python -m pip install '${{ matrix.numpy-pin }}' --break-system-packages
          python -m pip install --editable . --break-system-packages
      - name: Run dependency compatibility check
        run: python .travis/test-dependency-compat.py

  sim-manager-check:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Enable symlink
        run: sudo ln -sf $(which python3) /usr/bin/python
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --break-system-packages
          python -m pip install -r requirements.txt --break-system-packages
          python -m pip install coverage pytest --break-system-packages
          python -m pip install --editable . --break-system-packages
      - name: Install optional condor builder dep
        # lscsoft-glue is optional; with it, the smoke test also exercises the
        # Condor build_master_job + generate_dag round trip. Without it the
        # condor portion of the smoke test simply skips.
        continue-on-error: true
        run: python -m pip install lscsoft-glue --break-system-packages
      - name: Run simulation_manager smoke test
        run: bash .travis/test-simulation-manager.sh

  integrator-gate-accounting-check:
    needs: install
    runs-on: ubuntu-latest
    # The shape-recovery gate and its opt-in flag probe are far too expensive for CI and stay out
    # of it. The ACCOUNTING that decides whether one of their rows BLOCKS a merge is neither: it is
    # pure logic, runs in seconds (no sampler is ever built -- the gate seams are stubbed), and a
    # bug in it silently CLEARS a real regression. That is not hypothetical: a noisy row failed a
    # PR, and the confirmation added to absorb it could be configured to re-test nothing, and its
    # two arms shared a monkey-patched sampler factory so the "default" arm ran with the flag on.
    # So this part runs on every pipeline.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Enable symlink
        run: sudo ln -sf $(which python3) /usr/bin/python
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --break-system-packages
          python -m pip install -r requirements.txt --break-system-packages
          python -m pip install coverage pytest --break-system-packages
          python -m pip install --editable . --break-system-packages
      - name: Run probe confirm-on-fail accounting and CIP intrinsic-prior tests
        # The CIP prior suite rides along here for the same reason: it is pure logic that
        # runs in seconds (it reads CIP's source with ast instead of importing it, so it
        # needs only numpy/scipy), and a wrong prior density or a mis-wired
        # --eccentricity-prior coordinate raises nothing -- it merely reweights the
        # posterior. Without a job invoking it the fix can regress behind green checks.
        run: |
          python -m pytest -q \
            MonteCarloMarginalizeCode/Code/test/expensive_before_merging/integrators/test_probe_confirm.py \
            MonteCarloMarginalizeCode/Code/test/test_cip_priors.py \
            MonteCarloMarginalizeCode/Code/test/test_cip_gp_kernel_bounds.py \
            MonteCarloMarginalizeCode/Code/test/test_cosmology_single_source.py

  q-window-stencil-check:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Enable symlink
        run: sudo ln -sf $(which python3) /usr/bin/python
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --break-system-packages
          python -m pip install -r requirements.txt --break-system-packages
          python -m pip install coverage pytest --break-system-packages
          python -m pip install --editable . --break-system-packages
      - name: Run Q_lm sub-sample stencil accuracy and selection gates
        # numpy-only, runs in seconds, but it guards a CORE LIKELIHOOD choice that fails
        # SILENTLY: picking the wrong sub-sample stencil raises nothing, it just makes Q_lm(t)
        # less accurate, which surfaces only as a slightly wrong likelihood surface.
        #
        # test_q_window_interp asserts the cubic/sinc crossover in BOTH directions on purpose.
        # sinc winning everywhere would mean the Lanczos window had been widened until it was no
        # longer a local stencil, so neither direction may be relaxed to make a change pass.
        # test_time_interp_choice pins the pipeline thresholds inside the measured ambiguous
        # band, and checks the decision uses the sampling rate the run is actually on.
        #
        # test_calmarg_stencil_gating runs its CPU arms without a GPU (its GPU arm is additive),
        # so it belongs here: it is what stops cubic/sinc being routed to the fused calibration
        # kernel, which is implemented for 'nearest' only.
        #
        # test_interpolate_time_cli runs the three scripts as real SUBPROCESSES (~30 s). That
        # cost is the point: the unit tests exercise the resolver and the gate predicate, but
        # neither can see whether the SCRIPTS are still wired to them. Reverting a parser to
        # const=None, or deleting a script's resolver call, leaves every unit test green while
        # restoring a bare flag that silently does nothing. All three mutations were checked to
        # fail these tests before they landed.
        #
        # The GPU parity files (test_q_window_interp_gpu, test_noloop_gpu_stencils) are
        # deliberately NOT here -- there is no GPU on these runners, and they would report as
        # skipped.  They are run by hand on a GPU node; the numbers are in PR #97.
        #
        # test_slowrot_* files do NOT belong here.  They are gated by slowrot-check, whose
        # manifest requires every test_slowrot_*.py in this directory to be listed or
        # explicitly excluded; a copy in this job's list is invisible to that manifest and
        # would simply run the file twice (issue #169).
        run: |
          python -m pytest -q \
            MonteCarloMarginalizeCode/Code/RIFT/likelihood/test_q_window_interp.py \
            MonteCarloMarginalizeCode/Code/RIFT/likelihood/test_time_interp_choice.py \
            MonteCarloMarginalizeCode/Code/RIFT/likelihood/test_calmarg_stencil_gating.py \
            MonteCarloMarginalizeCode/Code/RIFT/misc/test_psd_bandwidth.py \
            MonteCarloMarginalizeCode/Code/RIFT/likelihood/test_interpolate_time_cli.py

  slowrot-check:
    needs: install
    runs-on: ubuntu-latest
    # RIFT/likelihood/test_slowrot_*.py was run by NOTHING in this workflow until this
    # job landed: `grep -rn slowrot .github/workflows/ci.yml` returned a single hit and
    # it was a comment (issue #169).  That gap is worse than an ordinary one, because
    # the two most recent changes to this code are changes whose DELIVERABLE IS THE
    # GUARD -- #163 (the Nyquist derivative weight at both parities) and #165 (the
    # Hermitian Nyquist response weight, which provably moves no number).  Neither
    # leaves anything behind if its guard never runs.
    #
    # See .travis/test-slowrot.sh for why the gate counts tests and runs three files
    # outside pytest: five test_slowrot_*.py files collect ZERO items and exit 5, "no
    # tests ran", which reads as a pass, and three of those five carry asserts pytest
    # cannot count.
    #
    # SEPARATE FROM jax-ile-check ON PURPOSE.  This suite is numpy + lal: no GPU, no
    # jax, no numpyro.  Folding it into the jax gate would put a 1-2 minute numpy
    # regression behind that job's jax/numpyro install and its ~5-15 minute run, and
    # would couple a numpy failure's diagnosis to an unpinned upstream jax release.
    # Python 3.10 to match the sibling numpy jobs, NOT the 3.11 jax-ile-check needs.
    #
    # timeout-minutes is a runaway backstop, not a budget: it is more than an order of
    # magnitude above the observed job wall.  Measured cost, and the host-by-host numbers
    # behind it, are in PR #172 (2026-08) -- deliberately not restated here, because a
    # wall-clock table in a comment rots silently and nothing imports it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Enable symlink
        run: sudo ln -sf $(which python3) /usr/bin/python
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --break-system-packages
          python -m pip install -r requirements.txt --break-system-packages
          python -m pip install coverage pytest --break-system-packages
          python -m pip install --editable . --break-system-packages
      - name: Run slow-rotation / finite-size CPU regression gate
        env:
          OMP_NUM_THREADS: 1
        run: bash .travis/test-slowrot.sh

  jax-ile-check:
    needs: install
    runs-on: ubuntu-latest
    # test/jax/ was run by NOTHING in this workflow until this job landed (the file had
    # zero matches for "jax"), and two real defects survived a month each behind that
    # gap. See .travis/test-jax.sh for why the gate counts tests instead of just
    # invoking pytest: most files in test/jax/ are __main__ scripts, and pytest exits 5
    # ("no tests ran") on those -- a green tick over an empty run.
    #
    # Python 3.11 rather than the 3.10 used by the sibling jobs: current jax wheels
    # require >=3.11. jax/numpyro are installed UNPINNED and deliberately so (CI should
    # see what a user gets).  NOTE: RIFT.likelihood.jax_ile declares its dependencies
    # NOWHERE in setup.py -- extras_require['jax-apps'] is for RIFT.interpolators.jax_gp
    # and lists a different set -- so this job is their de-facto declaration.  An
    # extras_require['jax-ile'] would be the right home for them
    # and means a breaking upstream jax release can redden this job outside any PR's
    # control. If that becomes noisy, pin here rather than deleting the job.
    #
    # Cost.  CURRENT (EXPECTED_TESTS=144 in .travis/test-jax.sh): 144 tests, measured
    # 859 s of pytest on ldas-pcdev11 pinned to 16 cores (jax 0.9.2,
    # JAX_PLATFORMS=cpu, OMP_NUM_THREADS=1).  The count grew 27 -> 48 -> 64
    # (#180, fair-draw export) -> 95 (this PR, the tempering chooser), and #190
    # Cost.  CURRENT (EXPECTED_TESTS=153 in .travis/test-jax.sh): 153 tests, the 139
    # previously measured at 859 s of pytest on ldas-pcdev11 pinned to 16 cores
    # (jax 0.9.2, JAX_PLATFORMS=cpu, OMP_NUM_THREADS=1) plus test_angle_marg_exact.py
    # (30 tests, ~600 s local on ldas-grid, 16 cores, same stack -- the sizing
    # regressions run a deliberately large dense grid once).  The count grew
    # 27 -> 48 -> 64
    # (#180, fair-draw export) -> 95 (the tempering chooser) -> 139 -> 169 (the
    # exact angle-marginalization schemes + their review fixes), and #190
    # added test_interp_choices.py along the way; this note sat at 27 through
    # several of those, so re-derive it from the gate rather than trusting it.
    # test_jax_slowrot.py dominates (the p_max=0/p_max=1 rotation ladders and
    # freqresponse, each followed by the AD/jit/vmap/hessian checks); it is the first
    # thing to trim if CI minutes ever bite.  timeout-minutes is generous so a slower
    # runner does not flake, but a hang still ends.
    #
    # HISTORICAL, and left here only as a runner-vs-local calibration: when this job
    # collected 14 tests it measured 964 s wall locally and ran 14 passed in 285.96 s on
    # the actual runner (job 95750869285, python 3.11.15, jax 0.10.2, numpyro 0.21.0) --
    # ~10x headroom, with the unpinned install already a jax minor version ahead of the
    # 0.9.2 measured locally.  Do NOT read the 14 as a current count; the file list has
    # grown since and the gate asserts 169.  That runner-vs-local ratio (286 s runner
    # for 964 s local, ~3.4x) is why 859 s local is not a timeout concern at 60
    # minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Enable symlink
        run: sudo ln -sf $(which python3) /usr/bin/python
      - name: Install dependencies and the CPU JAX stack
        # ONE pip invocation on purpose: pip does not co-resolve across invocations, so
        # installing jax separately lets a jax-driven numpy bump past numba's ceiling land
        # as a dependency-conflict WARNING with exit 0, and surface later as a collection
        # error (factored_likelihood imports numba) that looks like a RIFT bug.
        # numpyro is needed by test_nuts_phimarg (the NUTS phase-marginalized sampler).
        # flowMC is deliberately NOT installed -- see test-jax.sh for the exclusions.
        run: |
          python -m pip install --upgrade pip --break-system-packages
          python -m pip install -r requirements.txt coverage pytest "jax[cpu]" numpyro --break-system-packages
          python -m pip install --editable . --break-system-packages
      - name: Run jax_ile CPU regression gate
        env:
          JAX_PLATFORMS: cpu
          OMP_NUM_THREADS: 1
        run: bash .travis/test-jax.sh

  lisa-check:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Enable symlink
        run: sudo ln -sf $(which python3) /usr/bin/python
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --break-system-packages
          python -m pip install -r requirements.txt --break-system-packages
          python -m pip install coverage pytest --break-system-packages
          python -m pip install --editable . --break-system-packages
      - name: Run LISA smoke and contract tests
        run: bash .travis/test-lisa.sh

  calmarg-check:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Enable symlink
        run: sudo ln -sf $(which python3) /usr/bin/python
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --break-system-packages
          python -m pip install -r requirements.txt --break-system-packages
          python -m pip install coverage pytest --break-system-packages
          python -m pip install --editable . --break-system-packages
      - name: Run calibration-marginalization regression gate
        run: bash .travis/test-calmarg.sh

  integration-check:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Enable symlink
        run: sudo ln -sf $(which python3) /usr/bin/python
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --break-system-packages
          python -m pip install -r requirements.txt --break-system-packages
          python -m pip install coverage pytest pytest-cov --break-system-packages
          python -m pip install --editable . --break-system-packages
      - name: Run integration sampler check
        run: bash .travis/test-integrate.sh

  asimov-integration:
    needs: install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - asimov-series: '0.5'
            asimov-spec: 'asimov>=0.5,<0.6'
          - asimov-series: '0.7'
            asimov-spec: 'asimov>=0.7,<0.8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Enable symlink
        run: sudo ln -sf $(which python3) /usr/bin/python
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --break-system-packages
          python -m pip install -r requirements.txt --break-system-packages
          python -m pip install coverage pytest --break-system-packages
          python -m pip install --editable . --break-system-packages
          python -m pip install htcondor --only-binary=:all: --break-system-packages
      - name: Install Asimov
        run: python -m pip install '${{ matrix.asimov-spec }}' 'asimov-gwdata>=0.4,<0.5' --break-system-packages
      - name: Install Asimov 0.7 pipeline plugins
        if: matrix.asimov-series == '0.7'
        run: python -m pip install 'asimov-bayeswave>=0.2,<0.3' 'pe-configurator>=1,<2' --break-system-packages
      - name: Run Asimov integration test
        run: bash .travis/test-asimov.sh

  test-run:
    needs: install
    runs-on: ubuntu-latest
    # Integrator + posterior gate. We run this in two CI lanes:
    #   - legacy : py3.9 + numpy 1.24.4 -- the historically known-good
    #              configuration on Linux x86_64 where np.float128 is real.
    #   - modern : py3.12 + numpy 2.x -- the forward-looking target. Catches
    #              numpy 2.x removals (np.product, np.cumproduct, np.in1d,
    #              np.alltrue, np.float_) and scipy >= 1.16 mvnun removal.
    # Both lanes must pass test-integrate.sh's GMM/AC/AV consistency check.
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: legacy
            python-version: '3.9'
            numpy-pin: 'numpy==1.24.4'
          - lane: modern
            python-version: '3.12'
            numpy-pin: 'numpy>=2.0,<3.0'
    name: test-run (${{ matrix.lane }} py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Enable symlink
        run: sudo ln -sf $(which python3) /usr/bin/python
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --break-system-packages
          python -m pip install -r requirements.txt --break-system-packages
          # Pin numpy AFTER requirements.txt so it overrides the unpinned
          # 'numpy' line in requirements.txt without changing the file.
          python -m pip install '${{ matrix.numpy-pin }}' --break-system-packages
          python -m pip install coverage pytest pytest-cov --break-system-packages
          python -m pip install --editable . --break-system-packages
      - name: Show resolved versions
        run: |
          python -c "import sys, numpy, scipy; print('python', sys.version); print('numpy', numpy.__version__); print('scipy', scipy.__version__)"
      - name: Run sampler unit/regression tests
        # Also run by .travis/test-integrate.sh (integration-check, py3.10). Repeated here
        # because this job is the only one matrixed over BOTH numpy lanes, and these tests
        # are the kind that break on numpy API removals (e.g. np.trapz -> np.trapezoid).
        run: python -m pytest -q MonteCarloMarginalizeCode/Code/test/test_limit_cosine_samplers.py
      - name: Run NAL / supplementary-likelihood hook tests
        # Also run by .travis/test-integrate.sh (integration-check, py3.10). Repeated here for the
        # same reason as above: nal_io is pure numpy and has a legacy-numpy fallback for
        # default_rng, so it must be exercised in BOTH numpy lanes.
        run: |
          python -m pytest -q MonteCarloMarginalizeCode/Code/test/test_nal_io.py \
                             MonteCarloMarginalizeCode/Code/test/test_supplementary_likelihood_hook.py
      - name: Run adaptive-volume collapse / evidence-accounting regressions
        # These were unguarded.  The AV live-volume-collapse family, the L0 rescue's warm
        # seed, and the portfolio fair-draw backend each shipped a regression suite that NO
        # CI job invoked, so a required check could stay green while any of them broke --
        # including suites from already-merged PRs.  They are exactly the kind that regress
        # silently: an evidence normalization or an inclusion probability is still a
        # plausible-looking number when it is wrong.  Fast (seconds each), CPU-only, and
        # matrixed over both numpy lanes here.
        run: |
          python -m pytest -q \
            MonteCarloMarginalizeCode/Code/test/test_av_empty_live_volume.py \
            MonteCarloMarginalizeCode/Code/test/test_l0_rescue_seed.py \
            MonteCarloMarginalizeCode/Code/test/test_seq_warmstart_seed.py \
            MonteCarloMarginalizeCode/Code/test/test_fairdraw_double_weighting.py \
            MonteCarloMarginalizeCode/Code/test/test_portfolio_fairdraw_backend.py \
            MonteCarloMarginalizeCode/Code/test/test_rvs_record.py
      - name: Audit _rvs consumers against the fair-draw rebind
        # sampler._rvs is rebound to an EXPORT resample at the end of integrate_log, and five
        # separate defects have come from a consumer reading it afterwards as though it were
        # the sample set.  This does not assert that post-rebind reads are bugs -- most are
        # legitimately per-row -- it asserts that every one of them carries a recorded human
        # verdict, so a NEW or MOVED consumer fails the build instead of being found later by
        # whoever happens to edit the surrounding code.
        run: |
          python MonteCarloMarginalizeCode/Code/test/expensive_before_merging/integrators/audit_rvs_fairdraw.py --check
      - name: Audit sampler backend contracts
        # (DESIGN_rvs_naming.md)  The backends are structurally different in ways
        # nothing states -- _rvs['integrand'] holds lnL on three of them, linear L on two, and
        # EITHER on mcsamplerEnsemble depending on a kwarg -- and a consumer that guesses wrong
        # gets a plausible number rather than an error.  This does not forbid the differences;
        # it fails when one CHANGES without the recorded table changing with it, so the next
        # developer meets a diff instead of a landmine.
        run: |
          python MonteCarloMarginalizeCode/Code/test/expensive_before_merging/integrators/audit_backend_contracts.py --check
      - name: Run test scripts
        run: |
          . .travis/test-coord.sh
          . .travis/test-posterior.sh
          bash .travis/test-run.sh
          bash .travis/test-run-alts.sh
          bash .travis/test-build.sh
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.lane }}-py${{ matrix.python-version }}
          path: |
            **/*.log
            **/test-results/*.xml

  container-dep-canary:
    # Dependency-resolution canary for the container build. The container ships
    # an UNPINNED dependency set (containers/requirements-container.txt) and
    # clones RIFT at build time, so a fresh upstream release can silently break
    # RIFT and only surface when a container rebuild fails (e.g. swig>=4.4.0,
    # issue #136). This job installs that same unpinned set + exercises the pixi
    # swig-post44 deployment lane and runs the import check, so we get an early
    # warning. Runs on push/PR AND weekly (see on.schedule).
    #
    # Non-blocking: it tracks UPSTREAM changes outside any PR author's control,
    # so a red run should alert maintainers, not block unrelated PRs.
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # pygsl_lite 0.1.8 uses the pre-84 distutils.spawn calling convention.
      # This affects only PEP 517 build backends, not the unpinned runtime solve.
      PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/containers/constraints-container-build.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'   # matches the container's python3.10
      - name: Enable symlink
        run: sudo ln -sf $(which python3) /usr/bin/python
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev
      - name: Install UNPINNED container dependency set (latest upstream)
        run: |
          python -m pip install --upgrade pip --break-system-packages
          # Strip the GPU-only cupy line: there is no GPU/driver in CI and the
          # canary's goal is dependency RESOLUTION + RIFT import, not cupy exec.
          # (cupy is not actually listed in requirements-container.txt, but be
          # defensive in case it is added later.)
          grep -viE '^\s*cupy' containers/requirements-container.txt > /tmp/req-canary.txt
          python -m pip install -r /tmp/req-canary.txt --break-system-packages
          python -m pip install pytest --break-system-packages
          python -m pip install --editable . --break-system-packages
      - name: Show resolved versions
        run: |
          python -c "import sys, numpy, scipy; print('python', sys.version); print('numpy', numpy.__version__); print('scipy', scipy.__version__)"
      - name: Import check (latest container deps)
        run: python .travis/test-all-mod.py

  container-swig-canary:
    # Companion to container-dep-canary: exercise the pixi swig-post44 lane,
    # which is the direct issue-#136 detector (swig>=4.4.0 breaking RIFT's
    # generated bindings). Kept as its own job so a swig failure is distinct
    # from a general dependency-resolution failure. Also non-blocking.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: swig-post44
      - name: swig version (post-4.4 lane)
        run: pixi run -e swig-post44 swig-version
      - name: Install RIFT (post-4.4 swig lane)
        run: pixi run -e swig-post44 install-rift
      - name: Import check (post-4.4 swig lane)
        run: pixi run -e swig-post44 import-check

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            docs/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip --break-system-packages
          python -m pip install -r requirements.txt --break-system-packages
          python -m pip install -r docs/requirements.txt --break-system-packages
          python -m pip install --editable . --break-system-packages
      - name: Build docs
        run: |
          cd docs
          make clean
          cd ..
          sphinx-build docs/source/ docs/build/
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/rift_O4d'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/
          publish_branch: gh-pages
          force_push: true
